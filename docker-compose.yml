services:
  frps:
    # Tag pin trong .frp-version. Đổi tag bằng script check-frp-update (có verify + rollback).
    # snowdreamtech là image community theo release upstream fatedier/frp.
    image: snowdreamtech/frps:v0.71.0
    container_name: sr8-frps
    restart: unless-stopped
    # CHỈ chạy trên VPS Linux. Docker Desktop Win/Mac không hỗ trợ host mode.
    # Test 1 máy Win: chạy loopback trong tests/ (xem tests/README.md).
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./frps.toml:/etc/frp/frps.toml:ro
      - sr8-data:/var/lib/sr8
    command: ["-c", "/etc/frp/frps.toml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7500/healthz || wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
  guard:
    # guard-go: reverse-proxy + TCP sealed splice, keep-alive pool, stream SSE/WebSocket.
    # sealed/guard.py giữ lại cho dev/test 1 máy. Production dùng guard-go.
    build:
      context: ./guard-go
      dockerfile: Dockerfile
    image: sr8-guard:local
    container_name: sr8-guard
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      GUARD_PORT: "19090"
      FRPS_VHOST: "127.0.0.1:8080"
      TCP_SEAL_PORT: "19091"
    volumes:
      - sr8-data:/var/lib/sr8
    depends_on:
      frps:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:19090/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    # Production wildcard cần plugin DNS (vd caddy:2-builder + cloudflare) + CF_API_TOKEN trong .env.
    image: caddy:2-alpine
    container_name: sr8-caddy
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    depends_on:
      guard:
        condition: service_started
  # bore-server là sidecar demo tạm, tắt mặc định trên production (profiles).
  bore-server:
    image: ekzhang/bore:latest
    container_name: sr8-bore
    restart: unless-stopped
    network_mode: host
    profiles: ["demo"]
    command: ["server"]

volumes:
  sr8-data:
